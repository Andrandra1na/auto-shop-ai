services:
  # Service 1 : Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: autoshop_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"  # Accessible depuis votre Debian sur localhost:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Service 2 : Backend FastAPI
  backend:
    build: ./backend
    container_name: autoshop_backend
    volumes:
      - ./backend:/app  # Montage pour le hot-reloading (modif code = update auto)
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy # Attend que la DB soit prête avant de se lancer

volumes:
  postgres_data: